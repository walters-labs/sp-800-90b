[package]
name = "sp-800-90b"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "NIST SP 800-90B entropy assessment library and command-line tools"
license = "MIT"
repository = "https://github.com/walters-labs/sp-800-90b"
readme = "README.md"
keywords = ["nist", "entropy", "random", "min-entropy", "statistics"]
categories = ["algorithms", "science"]
include = [
    "Cargo.toml", "Cargo.lock", "LICENSE", "THIRD_PARTY.md", "README.md",
    "src/**", "examples/**", "tests/**", "docs/**", "scripts/*.py",
]

[dependencies]
serde_json = "1"
sha2 = "0.10"
bzip2 = "0.6"
getrandom = "0.4"
rug = { version = "1.30", default-features = false, features = ["float", "std"] }

# Keep full-data assessment tests practical without rebuilding native dependencies.
[profile.test.package.sp-800-90b]
opt-level = 2

# bzip2 0.6 uses a Rust backend; debug compression dominates full-size IID tests.
[profile.test.package.libbz2-rs-sys]
opt-level = 3
